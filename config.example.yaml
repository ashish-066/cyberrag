# Copy to config.yaml to override defaults. Environment variables CTI_<NAME> beat this file.
# Every key is validated at start-up; a bad value prints a readable error and exits with code 2.
mode: prod              # demo | eval | prod  (eval refuses the demo overlay)
offline: true           # HF_HUB_OFFLINE=1 after scripts/download_models.py

llm_enabled: true       # the LLM is optional; verdicts never depend on it
# llm_url: http://127.0.0.1:1234/v1   # omit to auto-detect LM Studio / Ollama / llama.cpp
# llm_model: qwen2.5-3b-instruct      # omit to read the first model from /v1/models
llm_timeout_secs: 12
llm_retries: 1

top_k: 10
entail_threshold: 0.5
contra_threshold: 0.5
temporal_threshold_days: 90

session_ttl_secs: 7200
max_upload_bytes: 20971520
max_upload_pages: 200

load_demo_overlay: false   # true adds ONE clearly labelled DEMO - SYNTHETIC record (never with mode=eval)

mcp_host: 127.0.0.1
mcp_port: 8765
# mcp_token: set CTI_MCP_TOKEN instead of writing a secret here
rate_limit_per_min: 60
log_level: INFO
log_json: true
