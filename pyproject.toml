[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberrag"
version = "1.0.0"
description = "CTI evidence verification: hybrid GraphRAG, entity-gated NLI, and an MCP server (whentrue-cti)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "PyYAML>=6.0",
  "mcp>=2.0,<3",
  "torch>=2.0",
  "transformers>=4.35",
  "sentence-transformers>=2.2",
  "rank-bm25>=0.2.2",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "PyMuPDF>=1.23",
  "pyvis>=0.3.2",
  "stix2>=3.0",
  "stix2-validator>=3.1",
  "truststore>=0.8",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "matplotlib>=3.7"]
dev = ["pytest>=7", "hypothesis>=6", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
whentrue-cti-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["src*", "mcp_server*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["data", "outputs", "scripts/notebook_dump.txt"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]
ignore = ["F401"]
